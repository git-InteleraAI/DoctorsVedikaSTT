name: Deploy Doctors Vedika to AWS

on:
  push:
    branches:
      - production-update

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            cd /opt/doctors-vedika/DoctorsVedikaSTT

            echo "Fetching latest production-update branch..."

            git -c credential.helper="!f() { echo username=x-access-token; echo password=\$GITHUB_TOKEN; }; f" fetch origin production-update

            echo "Resetting EC2 code to GitHub production-update..."

            git reset --hard origin/production-update

            echo "Building Docker containers..."

            sudo docker compose build

            echo "Starting Docker containers..."

            sudo docker compose up -d

            echo "Checking container status..."

            sudo docker compose ps

            echo "Deployment completed successfully."
